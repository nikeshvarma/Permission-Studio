# Runs the test suite and the browser tests on every push and pull request.
name: CI
on:
  push:
    branches: ['**']
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Tests
        run: npm test
      - name: Build the .vsix
        run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: dist/*.vsix
  ui:
    # The browser tests: the real screen (media/app.js, media/app.css) in Chromium, driven like a user:
    # layout at laptop sizes, one design for every element, scrolling, the health check, saving.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Playwright and Chromium
        run: |
          pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Browser tests
        run: python test/ui/run_all.py
