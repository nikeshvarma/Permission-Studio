# Runs the test suite on every push and pull request.
name: CI
on:
  push:
    branches: ['**']
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Tests
        run: npm test
      - name: Build the .vsix
        run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: dist/*.vsix
