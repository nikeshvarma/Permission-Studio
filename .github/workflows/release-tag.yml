
name: Auto Release Tag

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  run-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Run CI Checks
        run: echo "Run your actual CI checks here"

  tag:
    needs: run-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create and Push Tag
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          VERSION="v$(date -u +'%Y.%m.%d')-${GITHUB_SHA::7}"

          git tag -a "$VERSION" -m "Automated release tag for build $VERSION"
          git push origin "$VERSION"
